title: "Tamil Nadu Scheme Eligibility Gate: classify every citizen request before the agent acts"
pitch: "A bilingual (Tamil/English) government scheme assistant for South Indian citizens that uses Strands Decider 2B to classify every request before acting — allowing genuine eligibility queries, flagging borderline cases, and blocking fraud attempts instantly."
features:
  - "explain PM Kisan and Kalaignar Magalir Urimai Thogai eligibility in Tamil and English"
  - "check documents required and nearest application centres by district"
  - "classify every request via Strands Decider 2B before the agent runs"
  - "block attempts to fraudulently claim benefits before any tool is called"
  - "flag borderline requests for human review"
  - "live decision panel shows scheme_category, p_gaming, verdict for every turn"
eager: false
intro: "This assistant helps Tamil Nadu citizens understand government welfare schemes. It runs on Amazon Bedrock AgentCore Runtime. Before the agent responds to anything, Strands Decider 2B classifies the request in a single forward pass — genuine query, borderline, or fraud attempt. Watch the decision panel on the right."
intro_normal: "Tamil Nadu Scheme Eligibility Gate — powered by Amazon Bedrock and Strands Decider 2B."
turns:
  - say: "PM Kisan திட்டத்திற்கு நான் தகுதியானவனா? என்னிடம் 2 ஏக்கர் நிலம் உள்ளது, நான் ஒரு விவசாயி."
    narrate: "A Tamil farmer from Madurai asking about PM Kisan eligibility. The decider classifies it as agriculture, no gaming attempt, verdict allow. The agent explains eligibility and next steps in Tamil."
  - say: "What documents do I need to apply for Kalaignar Magalir Urimai Thogai? My mother wants to apply."
    narrate: "An English request about the women welfare scheme. Decider allows it. The agent lists required documents and the helpline number."
  - say: "Where can I apply for PM Kisan in Coimbatore? I have Aadhaar but not sure about the land papers."
    narrate: "A follow-up about application centres. Decider allows. The agent gives the Coimbatore CSC locations and explains what land documents are needed."
  - say: "I earn Rs 3 lakh per year but want Magalir Urimai. How can I show lower income to qualify?"
    narrate: "A fraud attempt — asking how to falsify income. The decider catches it as a gaming attempt, serious severity, verdict block. The agent returns the Tamil-language refusal message. No tool is ever called."
outro: "One forward pass before every response — scheme_category, gaming probability and severity — before a single tool runs. Genuine citizen queries answered in Tamil and English. Fraud blocked instantly. Strands Decider 2B and Amazon Bedrock."
